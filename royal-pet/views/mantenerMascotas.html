<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Pet - Mascotas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Contenedor global de alertas animadas -->
  <div class="toast-container" id="toastContainer"></div>

  <aside class="sidebar">
    <div class="logo-container" title="Logo Royal Pet">
        <img src="img/royalpet.jpeg" alt="Logo royal Pet">
    </div>

    <ul class="nav-links">
      <li><a href="index.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
      <li><a href="mantenerEmpleados.html"><i class="fa-solid fa-user-doctor"></i> Empleados</a></li>
      <li><a href="mantenerClientes.html"><i class="fa-solid fa-users"></i> Clientes</a></li>
      <li><a href="mantenerMascotas.html" class="active"><i class="fa-solid fa-dog"></i> Mascotas</a></li>
      <li><a href="mantenerServicios.html"><i class="fa-solid fa-stethoscope"></i> Servicios</a></li>
    </ul>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Gestión de Mascotas</h1>
        <p class="page-subtitle">Control clínico, pacientes y expedientes de la veterinaria</p>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="buscarMascota" placeholder="Buscar por nombre, especie, raza o dueño...">
      </div>
      <button class="btn btn-primary" id="btnNuevaMascota">
        <i class="fa-solid fa-plus"></i> Nueva Mascota
      </button>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Especie / Raza</th>
            <th>Sexo</th>
            <th>Edad / Peso</th>
            <th>Estado de Salud</th>
            <th>Propietario</th>
            <th>Historial / Cartilla</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaMascotas">
          <!-- Se renderiza dinámicamente con JS -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal Profesional Agregar / Editar Mascota -->
  <div class="modal-overlay" id="modalMascota">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="modalMascotaTitulo">Registrar Nueva Mascota</h2>
        <button class="close-modal" onclick="cerrarModal('modalMascota')"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="formMascota" novalidate>
        <input type="hidden" id="mascId">

        <div class="form-grid">
          <div class="form-group">
            <label>Nombre de la Mascota <span class="required-star">*</span></label>
            <input type="text" id="mascNombre" placeholder="Ej. Max" required>
          </div>

          <div class="form-group">
            <label>Especie <span class="required-star">*</span></label>
            <select id="mascEspecie" required>
              <option value="">Selecciona una especie...</option>
              <option value="Perro">Perro</option>
              <option value="Gato">Gato</option>
              <option value="Ave">Ave</option>
              <option value="Roedor">Roedor</option>
              <option value="Reptil">Reptil</option>
              <option value="Otro">Otro</option>
            </select>
          </div>

          <div class="form-group">
            <label>Raza <span class="required-star">*</span></label>
            <input type="text" id="mascRaza" placeholder="Ej. Golden Retriever / Mestizo" required>
          </div>

          <div class="form-group">
            <label>Sexo <span class="required-star">*</span></label>
            <select id="mascSexo" required>
              <option value="">Selecciona el sexo...</option>
              <option value="Macho">Macho</option>
              <option value="Hembra">Hembra</option>
            </select>
          </div>

          <div class="form-group">
            <label>Edad <span class="required-star">*</span></label>
            <input type="text" id="mascEdad" placeholder="Ej. 3 años o 8 meses" required>
          </div>

          <div class="form-group">
            <label>Peso (kg) <span class="required-star">*</span></label>
            <input type="number" step="0.1" id="mascPeso" placeholder="Ej. 14.5" min="0.1" max="200" required>
          </div>

          <div class="form-group">
            <label>Estado de Salud <span class="required-star">*</span></label>
            <select id="mascSalud" required>
              <option value="">Selecciona estado...</option>
              <option value="Saludable / Estable">Saludable / Estable</option>
              <option value="En Tratamiento">En Tratamiento</option>
              <option value="En Observación">En Observación</option>
              <option value="Post-operatorio">Post-operatorio</option>
            </select>
          </div>

          <div class="form-group">
            <label>Propietario (Cliente) <span class="required-star">*</span></label>
            <input type="text" id="mascDueno" placeholder="Nombre del dueño" required>
          </div>

          <div class="form-group full-width">
            <label>Adjuntar Cartilla de Vacunación / Historial Clínico</label>
            <label class="file-drop-area" for="mascArchivo">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <div style="font-size: 0.82rem; color: #64748b;">Clic para subir PDF, JPG o PNG</div>
              <input type="file" id="mascArchivo" accept=".pdf,.jpg,.jpeg,.png">
              <span class="file-name-preview" id="nombreArchivoPreviewMascota">Ningún archivo seleccionado</span>
            </label>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="cerrarModal('modalMascota')">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Guardar Mascota</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/shared/utilidades.js"></script>
  <script src="js/mascotas/mascota.js"></script>
</body>
</html>
