<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Pet - Empleados</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Contenedor global de alertas animadas -->
  <div class="toast-container" id="toastContainer"></div>

  <aside class="sidebar">
    <div class="logo-container" title="Logo Royal Pet">
        <img src="img/royalpet.jpeg" alt="Logo royal Pet">
    </div>

    <ul class="nav-links">
      <li><a href="index.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
      <li><a href="mantenerEmpleados.html" class="active"><i class="fa-solid fa-user-doctor"></i> Empleados</a></li>
      <li><a href="mantenerClientes.html"><i class="fa-solid fa-users"></i> Clientes</a></li>
      <li><a href="mantenerMascotas.html"><i class="fa-solid fa-dog"></i> Mascotas</a></li>
      <li><a href="mantenerServicios.html"><i class="fa-solid fa-stethoscope"></i> Servicios</a></li>
    </ul>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Gestión de Empleados</h1>
        <p class="page-subtitle">Control de personal médico, estético y administrativo de la clínica</p>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="buscarEmpleado" placeholder="Buscar por nombre, puesto o correo...">
      </div>
      <button class="btn btn-primary" id="btnNuevoEmpleado">
        <i class="fa-solid fa-plus"></i> Nuevo Empleado
      </button>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre Completo</th>
            <th>Edad</th>
            <th>Puesto</th>
            <th>Teléfono</th>
            <th>Correo</th>
            <th>Dirección</th>
            <th>Turno</th>
            <th>Archivo</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaEmpleados">
          <!-- Se renderiza dinámicamente con JS -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal Profesional Agregar / Editar Empleado -->
  <div class="modal-overlay" id="modalEmpleado">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="modalEmpleadoTitulo">Registrar Nuevo Empleado</h2>
        <button class="close-modal" onclick="cerrarModal('modalEmpleado')"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="formEmpleado" novalidate>
        <input type="hidden" id="empId">

        <div class="form-grid">
          <div class="form-group full-width">
            <label>Nombre Completo <span class="required-star">*</span></label>
            <input type="text" id="empNombre" placeholder="Ej. Dra. Sofía Mendoza" required>
          </div>

          <div class="form-group">
            <label>Edad <span class="required-star">*</span></label>
            <input type="number" id="empEdad" placeholder="Ej. 28" min="18" max="80" required>
          </div>

          <div class="form-group">
            <label>Puesto / Especialidad <span class="required-star">*</span></label>
            <select id="empPuesto" required>
              <option value="">Selecciona un puesto...</option>
              <option value="Médico Veterinario">Médico Veterinario</option>
              <option value="Cirujano Veterinario">Cirujano Veterinario</option>
              <option value="Estilista Canino">Estilista Canino</option>
              <option value="Recepcionista">Recepcionista</option>
              <option value="Asistente Clínico">Asistente Clínico</option>
            </select>
          </div>

          <div class="form-group">
            <label>Teléfono (10 dígitos) <span class="required-star">*</span></label>
            <input type="tel" id="empTelefono" placeholder="5512345678" maxlength="10" required>
          </div>

          <div class="form-group">
            <label>Correo Electrónico <span class="required-star">*</span></label>
            <input type="email" id="empCorreo" placeholder="empleado@royalpet.com" required>
          </div>

          <div class="form-group full-width">
            <label>Dirección Completa <span class="required-star">*</span></label>
            <input type="text" id="empDireccion" placeholder="Calle, número exterior/interior, colonia y municipio" required>
          </div>

          <div class="form-group">
            <label>Turno Laboral <span class="required-star">*</span></label>
            <select id="empTurno" required>
              <option value="">Selecciona un turno...</option>
              <option value="Matutino">Matutino (08:00 - 16:00)</option>
              <option value="Vespertino">Vespertino (14:00 - 22:00)</option>
              <option value="Completo">Tiempo Completo</option>
            </select>
          </div>

          <div class="form-group">
            <label>Adjuntar Documentación (CV / Cédula)</label>
            <label class="file-drop-area" for="empArchivo">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <div style="font-size: 0.82rem; color: #64748b;">Clic para subir PDF, JPG o PNG</div>
              <input type="file" id="empArchivo" accept=".pdf,.jpg,.jpeg,.png">
              <span class="file-name-preview" id="nombreArchivoPreview">Ningún archivo seleccionado</span>
            </label>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="cerrarModal('modalEmpleado')">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Guardar Empleado</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/shared/utilidades.js"></script>
  <script src="js/empleados/empleado.js"></script>
</body>
</html>
